<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Buzón</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- HEADER -->
        <header>
            <h1><i class="fas fa-chart-pie"></i> Panel de Administración</h1>
            <div class="header-user">
                <span id="userEmail"><i class="fas fa-user-circle"></i> <span id="userEmailText"></span></span>
                <button id="btnLogout" class="btn-danger"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>
        </header>

        <!-- ESTADÍSTICAS -->
        <section class="stats">
            <div class="stats-group">
                <h4><i class="fas fa-circle"></i> Por Estado</h4>
                <div class="stats-cards">
                    <div class="stat-card stat-total">
                        <span class="stat-number" id="totalTickets">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                    <div class="stat-card stat-pendientes">
                        <span class="stat-number" id="pendientes">0</span>
                        <span class="stat-label">Pendientes</span>
                    </div>
                    <div class="stat-card stat-revision">
                        <span class="stat-number" id="enRevision">0</span>
                        <span class="stat-label">En revisión</span>
                    </div>
                    <div class="stat-card stat-proceso">
                        <span class="stat-number" id="enProceso">0</span>
                        <span class="stat-label">En proceso</span>
                    </div>
                    <div class="stat-card stat-vencidos">
                        <span class="stat-number" id="vencidos">0</span>
                        <span class="stat-label">Vencidos</span>
                    </div>
                    <div class="stat-card stat-resueltos">
                        <span class="stat-number" id="resueltos">0</span>
                        <span class="stat-label">Resueltos</span>
                    </div>
                </div>
            </div>

            <div class="stats-group">
                <h4><i class="fas fa-building"></i> Por Dependencia</h4>
                <div class="stats-cards" id="dependenciasStats">
                    <p style="color: #999; text-align: center; padding: 10px; grid-column: 1 / -1;">Cargando...</p>
                </div>
            </div>

            <div class="stats-group">
                <h4><i class="fas fa-tag"></i> Por Asunto</h4>
                <div class="stats-cards" id="asuntosStats">
                    <p style="color: #999; text-align: center; padding: 10px; grid-column: 1 / -1;">Cargando...</p>
                </div>
            </div>
        </section>

        <!-- BÚSQUEDA GLOBAL -->
        <section class="busqueda-section">
            <div class="busqueda-global">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="busquedaGlobal" placeholder="Buscar por folio, nombre, contacto...">
                <button id="btnBuscar">Buscar</button>
                <button id="btnLimpiarBusqueda" class="btn-secondary">Limpiar</button>
            </div>
        </section>

        <!-- FILTROS -->
        <section class="filtros">
            <div class="filtros-header">
                <h3><i class="fas fa-filter"></i> Filtros</h3>
            </div>
            
            <div class="filtros-grid">
                <div class="filtro-grupo">
                    <label>Tipo de fecha</label>
                    <select id="tipoFiltroFecha">
                        <option value="ninguno">Sin filtro de fecha</option>
                        <option value="anio">Año específico</option>
                        <option value="mes">Mes específico</option>
                        <option value="periodo">Periodo (de - a)</option>
                        <option value="dia">Día específico</option>
                    </select>
                </div>

                <div class="filtro-grupo" id="filtroFechaContainer">
                    <p style="color: #999; font-size: 0.85em; padding: 5px 0;">Selecciona un tipo de filtro de fecha</p>
                </div>

                <div class="filtro-grupo">
                    <label>Fecha de qué acción</label>
                    <select id="filtroTipoAccion">
                        <option value="cualquier">Cualquier acción</option>
                        <option value="creacion">Generación del ticket</option>
                        <option value="actualizacion">Actualización de datos</option>
                        <option value="envio_dependencia">Envío a dependencia</option>
                        <option value="respuesta_dependencia">Respuesta de dependencia</option>
                        <option value="respuesta_ciudadano">Respuesta al ciudadano</option>
                        <option value="resolucion">Ticket resuelto</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label>Asunto</label>
                    <select id="filtroAsunto">
                        <option value="">Todos</option>
                        <option value="queja">Queja</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="felicitacion">Felicitación</option>
                        <option value="pendiente_clasificar">Por clasificar</option>
                        <option value="no_procede">No procede</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label>Dependencia</label>
                    <select id="filtroDependencia">
                        <option value="">Todas</option>
                        <option value="sistemas">Sistemas</option>
                        <option value="recursos_humanos">Recursos Humanos</option>
                        <option value="finanzas">Finanzas</option>
                        <option value="operaciones">Operaciones</option>
                        <option value="atencion_cliente">Atención al Cliente</option>
                        <option value="juridico">Jurídico</option>
                        <option value="compras">Compras</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label>Estado</label>
                    <select id="filtroEstado">
                        <option value="">Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_revision">En revisión</option>
                        <option value="en_proceso">En proceso</option>
                        <option value="vencido">Vencido</option>
                        <option value="resuelto">Resuelto</option>
                        <option value="cerrado">Cerrado</option>
                    </select>
                </div>
            </div>

            <div class="filtros-acciones">
                <button id="btnAplicarFiltros" class="btn-primary"><i class="fas fa-check"></i> Aplicar filtros</button>
                <button id="btnLimpiarFiltros" class="btn-secondary"><i class="fas fa-undo"></i> Limpiar</button>
                <button id="btnRecargar" class="btn-success"><i class="fas fa-sync"></i> Recargar</button>
            </div>
        </section>

        <!-- LISTA DE TICKETS -->
        <section class="tickets-list">
            <div class="tickets-header">
                <h3><i class="fas fa-list"></i> Tickets registrados <span id="contadorTickets"></span></h3>
            </div>
            <div id="ticketsContainer">
                <p style="text-align: center; color: #999;">Cargando tickets...</p>
            </div>
        </section>
    </div>

    <!-- MODAL PARA VER TICKET -->
    <div id="modalVerTicket" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalVer()">&times;</span>
            <div id="detalleTicketVer"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
