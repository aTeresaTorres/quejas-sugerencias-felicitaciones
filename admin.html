<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Buzón</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>📊 Panel de Administración</h1>
            <div>
                <span id="userEmail" style="margin-right: 15px; color: #666;"></span>
                <button id="btnLogout" class="btn-danger">Cerrar sesión</button>
            </div>
        </header>

        <!-- ESTADÍSTICAS RÁPIDAS -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-number" id="totalTickets">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="pendientes">0</span>
                <span class="stat-label">Pendientes</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="enRevision">0</span>
                <span class="stat-label">En revisión</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="resueltos">0</span>
                <span class="stat-label">Resueltos</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="vencidos">0</span>
                <span class="stat-label">Vencidos</span>
            </div>
        </section>

        <!-- FILTROS Y BÚSQUEDA -->
        <section class="filtros">
            <h3>🔍 Filtros y Búsqueda</h3>
            
            <!-- BÚSQUEDA GLOBAL -->
            <div class="busqueda-global">
                <div class="form-group" style="flex: 1;">
                    <label>🔎 Búsqueda global</label>
                    <input type="text" id="busquedaGlobal" placeholder="Buscar por folio, nombre, contacto...">
                </div>
                <button id="btnBuscar" style="margin-top: 24px;">Buscar</button>
                <button id="btnLimpiarBusqueda" style="margin-top: 24px; background: #6c757d;">Limpiar</button>
            </div>

            <!-- FILTROS DE FECHA AGRUPADOS -->
            <div class="filtros-fecha">
                <div class="form-group">
                    <label>Tipo de filtro de fecha</label>
                    <select id="tipoFiltroFecha">
                        <option value="ninguno">Sin filtro de fecha</option>
                        <option value="anio">Año específico</option>
                        <option value="mes">Mes específico</option>
                        <option value="periodo">Periodo (de - a)</option>
                        <option value="dia">Día específico</option>
                    </select>
                </div>
                
                <!-- Contenedor dinámico para filtros de fecha -->
                <div id="filtroFechaContainer">
                    <!-- Se llena dinámicamente con JS -->
                </div>
                
                <div class="form-group">
                    <label>Fecha de qué acción</label>
                    <select id="filtroTipoAccion">
                        <option value="cualquier">Cualquier acción</option>
                        <option value="creacion">Generación del ticket</option>
                        <option value="actualizacion">Actualización de datos</option>
                        <option value="envio_dependencia">Envío a dependencia</option>
                        <option value="respuesta_dependencia">Respuesta de dependencia</option>
                        <option value="respuesta_ciudadano">Respuesta al ciudadano</option>
                        <option value="resolucion">Ticket resuelto</option>
                    </select>
                </div>
            </div>

            <!-- FILTROS ADICIONALES -->
            <div class="filtros-grid">
                <div class="form-group">
                    <label>Asunto</label>
                    <select id="filtroAsunto">
                        <option value="">Todos</option>
                        <option value="queja">Queja</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="felicitacion">Felicitación</option>
                        <option value="pendiente_clasificar">Por clasificar</option>
                        <option value="no_procede">No procede</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dependencia</label>
                    <select id="filtroDependencia">
                        <option value="">Todas</option>
                        <option value="sistemas">Sistemas</option>
                        <option value="recursos_humanos">Recursos Humanos</option>
                        <option value="finanzas">Finanzas</option>
                        <option value="operaciones">Operaciones</option>
                        <option value="atencion_cliente">Atención al Cliente</option>
                        <option value="juridico">Jurídico</option>
                        <option value="compras">Compras</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="filtroEstado">
                        <option value="">Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_revision">En revisión</option>
                        <option value="en_proceso">En proceso</option>
                        <option value="vencido">Vencido</option>
                        <option value="resuelto">Resuelto</option>
                        <option value="cerrado">Cerrado</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button id="btnAplicarFiltros" style="width: 100%;">Aplicar filtros</button>
                    <button id="btnLimpiarFiltros" style="width: 100%; background: #6c757d; margin-left: 10px;">Limpiar</button>
                </div>
            </div>
        </section>

        <!-- LISTA DE TICKETS -->
        <section class="tickets-list">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>📋 Tickets registrados <span id="contadorTickets" style="font-size: 0.8em; color: #666;"></span></h3>
                <button id="btnRecargar" style="background: #28a745;">🔄 Recargar</button>
            </div>
            <div id="ticketsContainer">
                <p style="text-align: center; color: #999;">Cargando tickets...</p>
            </div>
        </section>
    </div>

    <!-- MODAL PARA VER TICKET (SOLO LECTURA) -->
    <div id="modalVerTicket" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalVer()">&times;</span>
            <div id="detalleTicketVer"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
