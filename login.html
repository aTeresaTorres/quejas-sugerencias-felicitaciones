<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administración</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container login-container" style="max-width: 400px;">
        <h2>🔐 Panel de Administración</h2>
        <p style="color: #666; margin-bottom: 20px;">Ingresa con tus credenciales</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="admin@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" style="width: 100%;">Ingresar</button>
        </form>
        
        <div id="mensajeError" style="color: red; margin-top: 15px; display: none;"></div>
    </div>

    <!-- SCRIPTS CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
